<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiMedicApp - Configuración</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-top">
            <img src="images/logo.png" alt="Logo" class="sidebar-icon">
        </div>
    
        <div class="bottom-group">
            <nav class="nav-menu">
                <div class="nav-item">
                    <img src="images/home.png" alt="Inicio" class="sidebar-icon">
                </div>
                <div class="nav-item">
                    <img src="images/notification.png" alt="Notificaciones" class="sidebar-icon">
                </div>
                <div class="nav-item">
                    <img src="images/report.png" alt="Reporte" class="sidebar-icon">
                </div>
                <div class="nav-item">
                    <img src="images/user.png" alt="Perfil" class="sidebar-icon">
                </div>
            </nav>
            
            <div class="nav-footer">
                <img src="images/menu.png" alt="Menu" class="sidebar-icon">
            </div>
        </div>
    </aside>

    <main class="main-container">
        <div class="settings-menu">
            <button class="menu-btn">NOTIFICACIONES</button>
            <button class="menu-btn">CAMBIAR CONTRASEÑA</button>
            <button class="menu-btn">AYUDA</button>
            
            <button id="btnOpenLogout" class="logout-btn">Cerrar Sesión</button>
            <button class="delete-btn">Eliminar Cuenta</button>
        </div>
    </main>

    <div id="modalLogout" class="modal-overlay">
        <div class="modal-card">
            <div class="question-container">
                <p>¿Está seguro que desea cerrar sesión?</p>
            </div>
            <div class="modal-actions">
                <button id="confirmSi" class="btn-si">Sí</button>
                <button id="confirmNo" class="btn-no">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
